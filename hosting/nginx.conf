# CAS-177 backup static host — nginx server block (self-hosted / VPS fallback).
# Mirrors tools/backup-host-policy.mjs rule-for-rule. Drop the exported
# deploy/backup-host/ contents under `root` and reload nginx.

server {
  listen 80;
  listen [::]:80;
  server_name _;                       # set to the backup domain when going live
  root /var/www/mithralda-backup;      # = contents of deploy/backup-host/
  index index.html;

  # 1) version.json — CAS-58 freshness lever (never cache).
  location = /version.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # 2) HTML entry points revalidate so the cache-busting bootstrap reruns.
  location ~* \.html$ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # 3) Everything else is requested with ?v=<build> -> cache hard, 1 year.
  location / {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri $uri/ =404;
  }

  # gzip the text assets (JS is the bulk of the bundle)
  gzip on;
  gzip_types text/javascript application/javascript application/json image/svg+xml text/css;
  gzip_min_length 512;
}
