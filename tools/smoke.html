<!doctype html><html><head><meta charset="utf-8"><title>smoke</title>
<style>html,body{margin:0;background:#0c0e13}#c{image-rendering:pixelated}
#nameWrap{display:none}</style></head><body>
<canvas id="c"></canvas>
<div id="nameWrap"><input id="nameInput"></div>
<script type="module">
// Headless smoke test: boot the real modules, force a play frame, render it.
import { configure, G, update, createHero, dev } from "../sim/sim.js";
import { io, initInput } from "../input.js";
import { audio } from "../audio.js";
import { view } from "../view.js";
import { createRenderer } from "../render/render.js";
import { loadAllAssets } from "../render/sprites.js";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha:false });
canvas.width = view.VW = 900; canvas.height = view.VH = 600;
ctx.imageSmoothingEnabled = false;

configure({ io, audio, view });
initInput(canvas);
const renderer = createRenderer(ctx);
loadAllAssets();

createHero("Smoke", "warrior");          // enter the play scene
dev.spawn("wolf", 120, -30);
dev.spawn("skeleton", -110, -60);
for (let i = 0; i < 240; i++) update(1000/60);   // step ~4s of simulation
renderer.render(0);

window.__smoke = { scene: G.scene, enemies: G.enemies.length, heroHp: G.hero.hp };
document.title = "smoke-ok scene=" + G.scene + " ent=" + G.enemies.length;
</script>
</body></html>
